<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class Ghost</title>
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#0d0f17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(18, 22, 34, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --btn-green: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-red: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.12) 0, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(129, 140, 248, 0.10) 0, transparent 40%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-gradient);
    }

    .title-area {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      color: var(--accent);
      font-size: 11px;
    }

    input, textarea {
      width: 100%;
      background: rgba(10, 13, 20, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    textarea {
      height: 80px;
      resize: vertical;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      transition: all 0.2s ease;
      color: #fff;
    }

    .btn-start {
      background: var(--btn-green);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
    }

    .btn-start:disabled {
      background: rgba(255, 255, 255, 0.05);
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-stop {
      background: var(--btn-red);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
      display: none;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }

    .dot.active {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .dot.error {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-text {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    .link {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .link:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title-area">
      <h1>Class Ghost Pro</h1>
      <p class="subtitle">Cloud Meeting Runner</p>
    </div>

    <div class="field">
      <label>Backend Endpoint</label>
      <input type="text" id="backendUrl" value="https://class-ghost-backend.onrender.com">
    </div>

    <div class="field">
      <label>Meeting Link <span class="badge">Required</span></label>
      <input type="text" id="meetingUrl" placeholder="https://meet.google.com/xxx-xxxx-xxx">
    </div>

    <div class="field">
      <label>Session Cookies (JSON) <span class="badge">Required</span></label>
      <textarea id="cookies" placeholder="Paste JSON exported from Cookie-Editor..." oninput="validate()"></textarea>
    </div>

    <button class="btn-start" id="startBtn" onclick="startSession()" disabled>
      <span>Deploy Bot to Call</span>
    </button>
    <button class="btn-stop" id="stopBtn" onclick="stopSession()">
      <span>Leave Call (Stop)</span>
    </button>

    <div class="status-box">
      <div class="dot" id="dot"></div>
      <div class="status-text" id="statusMsg">Idle: Paste cookies to enable</div>
    </div>

    <div class="links">
      <a class="link" id="viewLink" href="https://class-ghost-backend.onrender.com/view" target="_blank">Open Live Screenshot ↗</a>
    </div>
  </div>
</div>

<script>
  let sessionId = localStorage.getItem('cg_session_id');
  let poller = null;

  function updateStatus(text, type = "idle") {
    document.getElementById('statusMsg').innerText = text;
    const dot = document.getElementById('dot');
    dot.className = "dot " + (type === "active" ? "active" : type === "error" ? "error" : "");
  }

  function validate() {
    const raw = document.getElementById('cookies').value.trim();
    const btn = document.getElementById('startBtn');

    if (!raw) {
      if (!sessionId) {
        btn.disabled = true;
        updateStatus("Idle: Paste cookies to enable", "idle");
      }
      return false;
    }

    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) {
        btn.disabled = true;
        updateStatus("Error: Cookies must be a non-empty JSON array", "error");
        return false;
      }
    } catch (e) {
      btn.disabled = true;
      updateStatus("Error: Invalid JSON syntax", "error");
      return false;
    }

    btn.disabled = false;
    updateStatus("Ready to deploy", "active");
    return true;
  }

  async function startSession() {
    if (!validate()) return;

    const backend = document.getElementById('backendUrl').value.replace(/\/$/, "");
    const url = document.getElementById('meetingUrl').value.trim();
    const cookiesRaw = document.getElementById('cookies').value.trim();

    if (!url) {
      alert("Please enter a meeting link.");
      return;
    }

    updateStatus("Connecting to runner...", "active");
    document.getElementById('startBtn').disabled = true;

    try {
      const parsed = JSON.parse(cookiesRaw);
      const res = await fetch(`${backend}/start`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url, cookies: parsed })
      });

      if (!res.ok) throw new Error("Backend failed to start");

      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem('cg_session_id', sessionId);

      document.getElementById('cookies').value = "";
      validate();

      setActiveUi();
      poller = setInterval(checkStatus, 6000);
    } catch (err) {
      updateStatus("Error: Could not reach backend", "error");
      document.getElementById('startBtn').disabled = false;
    }
  }

  function setActiveUi() {
    updateStatus("Active in Call (Authenticated)", "active");
    document.getElementById('startBtn').style.display = "none";
    document.getElementById('stopBtn').style.display = "flex";
  }

  async function checkStatus() {
    if (!sessionId) return;
    const backend = document.getElementById('backendUrl').value.replace(/\/$/, "");
    try {
      const res = await fetch(`${backend}/status?session_id=${sessionId}`);
      const data = await res.json();
      if (data.status === "ended") {
        resetUi("Session ended / Disconnected");
      }
    } catch (e) {}
  }

  async function stopSession() {
    if (!sessionId) return;
    const backend = document.getElementById('backendUrl').value.replace(/\/$/, "");
    try {
      await fetch(`${backend}/stop`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId })
      });
    } catch (e) {}
    resetUi("Session stopped by user");
  }

  function resetUi(msg = "Session terminated") {
    clearInterval(poller);
    localStorage.removeItem('cg_session_id');
    sessionId = null;
    updateStatus(msg, "idle");
    document.getElementById('startBtn').style.display = "flex";
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').style.display = "none";
  }

  if (sessionId) {
    setActiveUi();
    poller = setInterval(checkStatus, 6000);
  }

  document.getElementById('meetingUrl').addEventListener('input', validate);
</script>
</body>
</html>
