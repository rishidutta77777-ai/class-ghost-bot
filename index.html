<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GhostAttend // Mobile Controller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(51, 65, 85, 0.7); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <header class="flex items-center justify-between py-3 border-b border-slate-800">
    <div class="flex items-center gap-2.5">
      <span id="dot" class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
      <div>
        <h1 class="text-base font-bold">GhostAttend <span class="text-[11px] font-mono text-emerald-400 bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800">512MB LITE</span></h1>
        <p id="statusText" class="text-xs text-slate-400">Idle • Ready to deploy</p>
      </div>
    </div>
    <button onclick="document.getElementById('serverBox').classList.toggle('hidden')" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
      ⚙️ Server URL
    </button>
  </header>

  <!-- Server URL Setting -->
  <div id="serverBox" class="hidden card rounded-xl p-3.5 my-2 space-y-2">
    <label class="text-xs text-slate-400 font-semibold uppercase">Your Cloud Backend URL (Render / Koyeb / etc.)</label>
    <input id="backendUrl" type="url" placeholder="https://your-app-name.onrender.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
    <button onclick="saveBackend()" class="w-full bg-emerald-600 py-2 rounded-lg text-xs font-bold">Save Backend URL</button>
  </div>

  <main class="space-y-4 my-auto py-3">
    <div class="card rounded-2xl p-5 space-y-4 shadow-xl">
      <div>
        <label class="text-xs font-semibold uppercase text-slate-400">Google Meet Class Link</label>
        <input id="meetUrl" type="url" placeholder="https://meet.google.com/xxx-xxxx-xxx" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-emerald-500" />
      </div>

      <div>
        <label class="text-xs font-semibold uppercase text-slate-400">Custom Name to Join With</label>
        <input id="studentName" type="text" value="Hrishikesh Dutta" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-emerald-500" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-400">Max Mins</label>
          <input id="maxDuration" type="number" value="50" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" />
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-400">Auto-Leave Below</label>
          <input id="minParticipants" type="number" value="5" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" />
        </div>
      </div>

      <button onclick="joinClass()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] transition font-bold py-3.5 rounded-xl text-sm shadow-lg">
        🚀 SEND STEALTH BOT TO CLASS
      </button>

      <button onclick="leaveClass()" class="w-full bg-rose-600 hover:bg-rose-500 active:scale-[0.99] transition font-bold py-3.5 rounded-xl text-sm shadow-lg">
        🛑 EMERGENCY LEAVE CLASS NOW
      </button>
    </div>

    <div class="card rounded-xl p-3.5 text-xs font-mono space-y-1">
      <div class="text-slate-400 uppercase text-[10px]">Live Server Status</div>
      <div id="liveMsg" class="text-emerald-400">Waiting for command...</div>
    </div>
  </main>

  <footer class="text-center text-[11px] text-slate-500 py-2">
    Zero-Width Anti-Spoof Name • 512MB RAM Protected
  </footer>

  <script>
    window.onload = () => {
      const saved = localStorage.getItem('backendUrl') || '';
      document.getElementById('backendUrl').value = saved;
      if (saved) pollStatus();
      setInterval(pollStatus, 6000);
    };

    function getBaseUrl() {
      return (localStorage.getItem('backendUrl') || '').replace(/\/+$/, '');
    }

    function saveBackend() {
      const val = document.getElementById('backendUrl').value.trim().replace(/\/+$/, '');
      localStorage.setItem('backendUrl', val);
      document.getElementById('serverBox').classList.add('hidden');
      document.getElementById('liveMsg').textContent = "Saved Backend: " + val;
      pollStatus();
    }

    async function joinClass() {
      const base = getBaseUrl();
      if (!base) {
        document.getElementById('serverBox').classList.remove('hidden');
        document.getElementById('liveMsg').textContent = "Please save your Cloud Backend URL first!";
        return;
      }
      const payload = {
        meet_url: document.getElementById('meetUrl').value.trim(),
        student_name: document.getElementById('studentName').value.trim(),
        max_duration: document.getElementById('maxDuration').value,
        min_participants: document.getElementById('minParticipants').value
      };
      document.getElementById('liveMsg').textContent = "Sending join request to cloud server...";
      try {
        const res = await fetch(`${base}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        document.getElementById('liveMsg').textContent = data.message || data.error;
      } catch (e) {
        document.getElementById('liveMsg').textContent = "Network error reaching server.";
      }
    }

    async function leaveClass() {
      const base = getBaseUrl();
      if (!base) return;
      document.getElementById('liveMsg').textContent = "Sending emergency leave signal...";
      try {
        const res = await fetch(`${base}/leave`, { method: 'POST' });
        const data = await res.json();
        document.getElementById('liveMsg').textContent = data.message;
      } catch (e) {
        document.getElementById('liveMsg').textContent = "Error contacting server.";
      }
    }

    async function pollStatus() {
      const base = getBaseUrl();
      if (!base) return;
      try {
        const res = await fetch(`${base}/status`);
        const state = await res.json();
        document.getElementById('statusText').textContent = `${state.status.toUpperCase()} • ${state.participants} in call`;
        document.getElementById('liveMsg').textContent = state.message;
      } catch (e) {}
    }
  </script>
</body>
</html>
