<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class Ghost Pro</title>
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#0d0f17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(18, 22, 34, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --btn-green: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-red: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.12) 0, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(129, 140, 248, 0.10) 0, transparent 40%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-gradient);
    }

    .title-area {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Server Switcher Pill */
    .server-switcher {
      display: flex;
      background: rgba(10, 13, 20, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .server-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .server-tab.active {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      color: var(--accent);
      font-size: 11px;
    }

    input, textarea {
      width: 100%;
      background: rgba(10, 13, 20, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    textarea {
      height: 75px;
      resize: vertical;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      transition: all 0.2s ease;
      color: #fff;
    }

    .btn-start {
      background: var(--btn-green);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
    }

    .btn-start:disabled {
      background: rgba(255, 255, 255, 0.05);
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-stop {
      background: var(--btn-red);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
      display: none;
    }

    .status-box {
      margin-top: 14px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }

    .dot.active {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .dot.error {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-text {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* In-App Live Snapshot Section */
    .snapshot-section {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .snapshot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .snapshot-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    .btn-refresh {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      margin-top: 0;
      width: auto;
      cursor: pointer;
    }

    .btn-refresh:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    .snapshot-frame {
      width: 100%;
      height: 200px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .snapshot-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .snapshot-placeholder {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title-area">
      <h1>Class Ghost Pro</h1>
      <p class="subtitle">Cloud Meeting Runner</p>
    </div>

    <!-- Server Selector -->
    <div class="server-switcher">
      <div class="server-tab active" id="tabCodespace" onclick="setServer('codespace')">
        ⚡ Codespace (Stealth)
      </div>
      <div class="server-tab" id="tabRender" onclick="setServer('render')">
        ☁️ Render Cloud
      </div>
    </div>

    <div class="field" id="endpointField">
      <label>Active Endpoint <span class="badge" id="serverTag">GitHub Codespace</span></label>
      <input type="text" id="backendUrl" placeholder="https://...-8000.app.github.dev" oninput="saveEndpoint()">
    </div>

    <div class="field">
      <label>Meeting Link <span class="badge">Required</span></label>
      <input type="text" id="meetingUrl" placeholder="https://meet.google.com/xxx-xxxx-xxx">
    </div>

    <div class="field">
      <label>Session Cookies (JSON) <span class="badge">Required</span></label>
      <textarea id="cookies" placeholder="Paste JSON exported from Cookie-Editor..." oninput="validate()"></textarea>
    </div>

    <button class="btn-start" id="startBtn" onclick="startSession()" disabled>
      <span>Deploy Bot to Call</span>
    </button>
    <button class="btn-stop" id="stopBtn" onclick="stopSession()">
      <span>Leave Call & Stop VM</span>
    </button>

    <div class="status-box">
      <div class="dot" id="dot"></div>
      <div class="status-text" id="statusMsg">Idle: Paste cookies to enable</div>
    </div>

    <!-- Integrated Snapshot Viewer -->
    <div class="snapshot-section">
      <div class="snapshot-header">
        <span class="snapshot-title">Live Room View</span>
        <button class="btn-refresh" onclick="refreshSnapshot()">🔄 Refresh</button>
      </div>
      <div class="snapshot-frame">
        <img id="snapshotImg" alt="Meeting Snapshot" onload="onSnapshotLoaded()" onerror="onSnapshotError()">
        <div class="snapshot-placeholder" id="snapshotPlaceholder">
          No snapshot yet.<br>Deploy bot to preview screen.
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const RENDER_DEFAULT = "https://class-ghost-backend.onrender.com";
  let activeServerType = localStorage.getItem('cg_server_type') || 'codespace';
  let savedCodespaceUrl = localStorage.getItem('cg_codespace_url') || '';
  let sessionId = localStorage.getItem('cg_session_id');
  let poller = null;
  let snapshotPoller = null;

  function initServerSelection() {
    if (activeServerType === 'render') {
      document.getElementById('tabRender').classList.add('active');
      document.getElementById('tabCodespace').classList.remove('active');
      document.getElementById('backendUrl').value = RENDER_DEFAULT;
      document.getElementById('serverTag').innerText = "Render Free";
    } else {
      document.getElementById('tabCodespace').classList.add('active');
      document.getElementById('tabRender').classList.remove('active');
      document.getElementById('backendUrl').value = savedCodespaceUrl;
      document.getElementById('serverTag').innerText = "GitHub Codespace";
    }
  }

  function setServer(type) {
    activeServerType = type;
    localStorage.setItem('cg_server_type', type);
    initServerSelection();
    refreshSnapshot();
  }

  function saveEndpoint() {
    if (activeServerType === 'codespace') {
      savedCodespaceUrl = document.getElementById('backendUrl').value.trim();
      localStorage.setItem('cg_codespace_url', savedCodespaceUrl);
    }
  }

  function getBackendUrl() {
    return document.getElementById('backendUrl').value.replace(/\/$/, "");
  }

  function updateStatus(text, type = "idle") {
    document.getElementById('statusMsg').innerText = text;
    const dot = document.getElementById('dot');
    dot.className = "dot " + (type === "active" ? "active" : type === "error" ? "error" : "");
  }

  function validate() {
    const raw = document.getElementById('cookies').value.trim();
    const btn = document.getElementById('startBtn');

    if (!raw) {
      if (!sessionId) {
        btn.disabled = true;
        updateStatus("Idle: Paste cookies to enable", "idle");
      }
      return false;
    }

    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) {
        btn.disabled = true;
        updateStatus("Error: JSON must be an array", "error");
        return false;
      }
    } catch (e) {
      btn.disabled = true;
      updateStatus("Error: Invalid JSON syntax", "error");
      return false;
    }

    btn.disabled = false;
    updateStatus("Ready to deploy", "active");
    return true;
  }

  async function startSession() {
    if (!validate()) return;
    const backend = getBackendUrl();
    const url = document.getElementById('meetingUrl').value.trim();
    const cookiesRaw = document.getElementById('cookies').value.trim();

    if (!backend) {
      alert("Please enter the Codespace or Render URL.");
      return;
    }
    if (!url) {
      alert("Please enter a meeting link.");
      return;
    }

    updateStatus("Deploying to " + (activeServerType === 'codespace' ? 'Codespace...' : 'Render...'), "active");
    document.getElementById('startBtn').disabled = true;

    try {
      const parsed = JSON.parse(cookiesRaw);
      const res = await fetch(`${backend}/start`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url, cookies: parsed })
      });

      if (!res.ok) throw new Error("Backend reject");

      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem('cg_session_id', sessionId);

      document.getElementById('cookies').value = "";
      validate();

      setActiveUi();
      poller = setInterval(checkStatus, 6000);
      snapshotPoller = setInterval(refreshSnapshot, 10000);
      setTimeout(refreshSnapshot, 4000);
    } catch (err) {
      updateStatus("Error: Could not reach backend", "error");
      document.getElementById('startBtn').disabled = false;
    }
  }

  function setActiveUi() {
    updateStatus("Active in Call (" + (activeServerType === 'codespace' ? 'Codespace VM' : 'Render') + ")", "active");
    document.getElementById('startBtn').style.display = "none";
    document.getElementById('stopBtn').style.display = "flex";
  }

  async function checkStatus() {
    if (!sessionId) return;
    const backend = getBackendUrl();
    try {
      const res = await fetch(`${backend}/status?session_id=${sessionId}`);
      const data = await res.json();
      if (data.status === "ended") {
        resetUi("Session ended / Disconnected");
      }
    } catch (e) {}
  }

  async function stopSession() {
    if (!sessionId) return;
    const backend = getBackendUrl();
    updateStatus("Stopping bot & shutting down...", "active");

    try {
      await fetch(`${backend}/stop`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId })
      });
    } catch (e) {}

    resetUi(activeServerType === 'codespace' ? "Left meeting & Codespace stopped" : "Session stopped by user");
  }

  function resetUi(msg = "Session terminated") {
    clearInterval(poller);
    clearInterval(snapshotPoller);
    localStorage.removeItem('cg_session_id');
    sessionId = null;
    updateStatus(msg, "idle");
    document.getElementById('startBtn').style.display = "flex";
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').style.display = "none";
  }

  function refreshSnapshot() {
    const backend = getBackendUrl();
    if (!backend) return;
    const img = document.getElementById('snapshotImg');
    // Timestamp query prevents mobile browser caching
    img.src = `${backend}/view?t=${Date.now()}`;
  }

  function onSnapshotLoaded() {
    document.getElementById('snapshotImg').style.display = 'block';
    document.getElementById('snapshotPlaceholder').style.display = 'none';
  }

  function onSnapshotError() {
    document.getElementById('snapshotImg').style.display = 'none';
    document.getElementById('snapshotPlaceholder').style.display = 'block';
    document.getElementById('snapshotPlaceholder').innerHTML = "No snapshot available yet.<br>Tap refresh after bot joins.";
  }

  initServerSelection();
  if (sessionId) {
    setActiveUi();
    poller = setInterval(checkStatus, 6000);
    snapshotPoller = setInterval(refreshSnapshot, 10000);
    refreshSnapshot();
  }
  document.getElementById('meetingUrl').addEventListener('input', validate);
</script>
</body>
</html>
